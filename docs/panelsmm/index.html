<!DOCTYPE html>
<html lang="id" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05070a">
    <title>ReyCloud - Panel SMM & OTP (Maintenance)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { touch-action: manipulation; }
        body { background-color: #08090c; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; position: fixed; width: 100%; height: 100%; overflow: hidden; }
        .glass-panel {
            background: rgba(21, 25, 34, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp .45s ease both; }
        
        /* Cyberpunk Core / Shield Maintenance Animation */
        .cyber-core-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .core-ring {
            position: absolute;
            inset: 0;
            border: 2px dashed rgba(245, 158, 11, 0.35);
            border-radius: 50%;
            animation: spinRing 12s linear infinite;
        }
        .core-ring-inner {
            position: absolute;
            inset: 12px;
            border: 2px solid rgba(245, 158, 11, 0.2);
            border-radius: 50%;
            animation: spinRingReverse 8s linear infinite;
        }
        .core-shield {
            position: relative;
            width: 56px;
            height: 64px;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(15, 23, 42, 0.8));
            border: 2px solid #f59e0b;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.3);
            animation: shieldPulse 3s ease-in-out infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spinRingReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes shieldPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(245,158,11,0.4)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 18px rgba(245,158,11,0.7)); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 relative">

    <!-- Ambient Glow Background -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[350px] h-[180px] bg-amber-500/15 blur-[120px] pointer-events-none rounded-full"></div>
    <div class="absolute top-1/3 -right-20 w-[250px] h-[250px] bg-cyan-500/10 blur-[140px] pointer-events-none rounded-full"></div>

    <div class="w-full max-w-sm flex flex-col space-y-4 relative z-10 my-auto fade-up">
        
        <!-- Top Navbar Header -->
        <div class="flex items-center justify-between glass-panel border border-[#232936] rounded-2xl px-4 py-3 shadow-2xl">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 p-[1px] shadow-lg shadow-amber-500/10">
                    <div class="w-full h-full bg-[#0a0d12] rounded-[10px] flex items-center justify-center text-amber-400 font-black text-xs">
                        ⚡
                    </div>
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <span class="font-black text-xs tracking-wider text-white">REY<span class="text-amber-400">CLOUD</span></span>
                        <span class="px-1.5 py-0.5 rounded text-[8px] font-mono font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 uppercase">Pro</span>
                    </div>
                    <span class="text-[8px] tracking-widest text-slate-400 font-semibold uppercase">PANEL SMM & OTP</span>
                </div>
            </div>
            
            <span class="px-2.5 py-1 rounded-xl bg-amber-500/10 border border-amber-500/20 text-[10px] font-mono font-bold text-amber-400 uppercase">
                Locked
            </span>
        </div>

        <!-- Maintenance Card -->
        <div class="bg-[#0e1117]/95 backdrop-blur-xl border border-[#1e2637] rounded-3xl p-6 shadow-2xl text-center space-y-5 relative overflow-hidden">
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-amber-500/5 blur-3xl rounded-full pointer-events-none"></div>

            <!-- Cyberpunk Core / Shield Icon -->
            <div class="cyber-core-container">
                <div class="core-ring"></div>
                <div class="core-ring-inner"></div>
                <div class="core-shield">
                    <i class="fa-solid fa-lock text-amber-400 text-lg"></i>
                </div>
            </div>

            <div class="space-y-2">
                <span class="inline-block px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-[9px] font-mono font-bold text-amber-400 uppercase tracking-widest">
                    System Maintenance
                </span>
                <h3 class="text-lg font-black text-white tracking-wide uppercase">Fitur Sedang Dikunci</h3>
                <p class="text-[11px] text-slate-400 leading-relaxed px-2">
                    Panel SMM & OTP sedang dalam peningkatan sistem dan pemeliharaan server pusat. Silakan kembali beberapa saat lagi.
                </p>
            </div>

            <div class="pt-2">
                <a href="/dashboard" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-slate-950 font-black rounded-xl text-xs transition-all shadow-lg shadow-amber-500/20 flex items-center justify-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Kembali ke Dashboard Utama</span>
                </a>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="text-center text-[9px] text-slate-500 font-semibold tracking-wider">
            © 2026 ReyCloud • Secure Automated Gateway
        </div>

    </div>

</body>
</html>
