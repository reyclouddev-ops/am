<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReyCloud - Rayleigh AI Chat Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0d0f12; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 relative">

    <div class="w-full max-w-md flex flex-col h-[90vh] space-y-4">
        
        <!-- Top Navbar Logo / Header -->
        <div class="flex items-center justify-between bg-[#151922] border border-[#232936] rounded-2xl p-4 shadow-lg shrink-0">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold">
                    🤖
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <span class="font-extrabold text-sm tracking-wide text-white">RAYLEIGH<span class="text-amber-400">AI</span></span>
                    </div>
                    <span class="text-[10px] tracking-widest text-slate-400 font-semibold uppercase">EXPERT ASSISTANT</span>
                </div>
            </div>
            
            <a href="/dashboard" class="px-3 py-1.5 rounded-xl bg-[#1e2330] border border-[#2b3344] text-[11px] text-slate-300 hover:text-white transition-all font-medium">
                Kembali ke Home
            </a>
        </div>

        <!-- Chat Container -->
        <div id="chatContainer" class="flex-1 bg-[#151922] border border-[#232936] rounded-2xl p-4 overflow-y-auto space-y-3 shadow-inner">
            <div class="flex items-start space-x-2">
                <div class="w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                <div class="bg-[#1e2330] border border-[#2b3344] rounded-2xl px-4 py-2.5 text-xs text-slate-200 max-w-[85%] leading-relaxed">
                    Halo! Saya asisten AI multi-model ReyCloud. Pilih engine dan model favoritmu di bawah lalu mulai percakapan!
                </div>
            </div>
        </div>

        <!-- Input Box & Custom Dropdown Controls -->
        <div class="bg-[#151922] border border-[#232936] rounded-2xl p-3 shadow-xl shrink-0 space-y-2.5 relative">
            
            <!-- Custom Selector Bar -->
            <div class="flex items-center space-x-2">
                <!-- Engine Button -->
                <div class="relative">
                    <button onclick="toggleDropdown('engineDropdown')" id="engineBtn" class="bg-[#0d0f12] border border-[#232936] rounded-xl px-3 py-2 text-[11px] text-amber-400 font-bold flex items-center space-x-1.5 cursor-pointer hover:border-amber-400 transition-colors">
                        <span id="selectedEngineText">Rayleigh AI</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <!-- Engine Menu -->
                    <div id="engineDropdown" class="hidden absolute left-0 bottom-11 w-36 bg-[#151922] border border-[#2b3344] rounded-xl shadow-2xl py-1.5 z-50 space-y-0.5">
                        <button onclick="selectEngine('rayleigh', 'Rayleigh AI')" class="w-full text-left px-3 py-2 text-[11px] text-amber-400 font-semibold hover:bg-[#1e2330] transition-colors">Rayleigh AI</button>
                        <button onclick="selectEngine('deepai', 'DeepAI Chat')" class="w-full text-left px-3 py-2 text-[11px] text-cyan-400 font-semibold hover:bg-[#1e2330] transition-colors">DeepAI Chat</button>
                    </div>
                </div>

                <!-- Model Button (DeepAI Only) -->
                <div id="modelContainer" class="relative hidden flex-1">
                    <button onclick="toggleDropdown('modelDropdown')" id="modelBtn" class="w-full bg-[#0d0f12] border border-[#232936] rounded-xl px-3 py-2 text-[11px] text-cyan-400 font-bold flex items-center justify-between cursor-pointer hover:border-cyan-400 transition-colors">
                        <span id="selectedModelText" class="truncate">standard</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-slate-400 shrink-0 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </button>
                    <!-- Model Menu -->
                    <div id="modelDropdown" class="hidden absolute left-0 bottom-11 w-full bg-[#151922] border border-[#2b3344] rounded-xl shadow-2xl py-1.5 z-50 max-h-48 overflow-y-auto space-y-0.5">
                        <button onclick="selectModel('standard')" class="w-full text-left px-3 py-2 text-[11px] text-slate-200 hover:bg-[#1e2330] transition-colors">standard</button>
                        <button onclick="selectModel('deepseek-v3.2')" class="w-full text-left px-3 py-2 text-[11px] text-slate-200 hover:bg-[#1e2330] transition-colors">deepseek-v3.2</button>
                        <button onclick="selectModel('gemini-2.5-flash-lite')" class="w-full text-left px-3 py-2 text-[11px] text-slate-200 hover:bg-[#1e2330] transition-colors">gemini-2.5-flash-lite</button>
                        <button onclick="selectModel('gemma-4')" class="w-full text-left px-3 py-2 text-[11px] text-slate-200 hover:bg-[#1e2330] transition-colors">gemma-4</button>
                        <button onclick="selectModel('llama-3.3-70b-instruct')" class="w-full text-left px-3 py-2 text-[11px] text-slate-200 hover:bg-[#1e2330] transition-colors">llama-3.3-70b-instruct</button>
                        <button onclick="selectModel('gpt-oss-120b')" class="w-full text-left px-3 py-2 text-[11px] text-slate-200 hover:bg-[#1e2330] transition-colors">gpt-oss-120b</button>
                        <button onclick="selectModel('gpt-5-nano')" class="w-full text-left px-3 py-2 text-[11px] text-slate-200 hover:bg-[#1e2330] transition-colors">gpt-5-nano</button>
                    </div>
                </div>
            </div>

            <!-- Input & Send Button -->
            <div class="flex items-center space-x-2">
                <input type="text" id="userInput" placeholder="Ketik pertanyaan atau kode di sini..." 
                    class="flex-1 bg-[#0d0f12] border border-[#232936] rounded-xl px-4 py-2.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-400 transition-colors"
                    onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" id="sendBtn"
                    class="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs transition-all shadow cursor-pointer">
                    Kirim
                </button>
            </div>
        </div>

    </div>

    <script>
        let chatHistory = [];
        let currentEngine = 'rayleigh';
        let currentModel = 'standard';

        function toggleDropdown(id) {
            // Tutup dropdown lain dulu
            ['engineDropdown', 'modelDropdown'].forEach(d => {
                if (d !== id) document.getElementById(d).classList.add('hidden');
            });
            document.getElementById(id).classList.toggle('hidden');
        }

        function selectEngine(val, label) {
            currentEngine = val;
            document.getElementById('selectedEngineText').textContent = label;
            document.getElementById('engineDropdown').classList.add('hidden');
            
            const modelContainer = document.getElementById('modelContainer');
            if (val === 'deepai') {
                modelContainer.classList.remove('hidden');
            } else {
                modelContainer.classList.add('hidden');
            }
        }

        function selectModel(val) {
            currentModel = val;
            document.getElementById('selectedModelText').textContent = val;
            document.getElementById('modelDropdown').classList.add('hidden');
        }

        // Klik di luar untuk menutup dropdown
        window.onclick = function(event) {
            if (!event.target.closest('button')) {
                document.getElementById('engineDropdown').classList.add('hidden');
                document.getElementById('modelDropdown').classList.add('hidden');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const container = document.getElementById('chatContainer');
            const prompt = input.value.trim();

            if (!prompt) return;

            chatHistory.push({ role: 'user', content: prompt });

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = "flex items-start justify-end space-x-2";
            userMsgDiv.innerHTML = `
                <div class="bg-amber-400 text-slate-950 rounded-2xl px-4 py-2.5 text-xs max-w-[85%] leading-relaxed font-medium">${escapeHtml(prompt)}</div>
                <div class="w-7 h-7 rounded-lg bg-amber-400/20 text-amber-300 flex items-center justify-center font-bold text-xs shrink-0">You</div>
            `;
            container.appendChild(userMsgDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;

            const loadingId = 'load-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = "flex items-start space-x-2";
            loadingDiv.innerHTML = `
                <div class="w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                <div class="bg-[#1e2330] border border-[#2b3344] rounded-2xl px-4 py-2.5 text-xs text-amber-400 animate-pulse">Sedang memproses...</div>
            `;
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, engine: currentEngine, model: currentModel, history: chatHistory })
                });
                const json = await res.json();

                document.getElementById(loadingId).remove();

                const responseText = json.result || json.error || 'Terjadi kesalahan.';
                chatHistory.push({ role: 'assistant', content: responseText });

                const aiMsgDiv = document.createElement('div');
                aiMsgDiv.className = "flex items-start space-x-2";
                aiMsgDiv.innerHTML = `
                    <div class="w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
                    <div class="bg-[#1e2330] border border-[#2b3344] rounded-2xl px-4 py-2.5 text-xs text-slate-200 max-w-[85%] leading-relaxed whitespace-pre-wrap font-mono">${escapeHtml(responseText)}</div>
                `;
                container.appendChild(aiMsgDiv);
                container.scrollTop = container.scrollHeight;

            } catch (err) {
                document.getElementById(loadingId).remove();
                alert('Gagal terhubung ke server: ' + err.message);
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
