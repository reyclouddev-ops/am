<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReyCloudSHP - Viu Drama Streaming</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0d0f12; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-3 sm:p-6 relative">

    <div class="w-full max-w-4xl space-y-4">
        
        <!-- Navbar -->
        <div class="flex items-center justify-between bg-[#151922] border border-[#232936] rounded-2xl p-4 shadow-lg">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center text-orange-400 font-bold">
                    🍿
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <span class="font-extrabold text-sm tracking-wide text-white">VIU<span class="text-orange-400">DRAMA</span></span>
                    </div>
                    <span class="text-[10px] tracking-widest text-slate-400 font-semibold uppercase">STREAMING & SEARCH CENTER</span>
                </div>
            </div>
            
            <a href="/dashboard" class="px-3 py-1.5 rounded-xl bg-[#1e2330] border border-[#2b3344] text-[11px] text-slate-300 hover:text-white transition-all font-medium">
                Kembali Dashboard
            </a>
        </div>

        <!-- SEARCH BAR & TAB CONTROL -->
        <div class="bg-[#151922] border border-[#232936] rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="searchQuery" placeholder="Cari judul drama, korea, romance, ceo..." 
                    class="flex-1 bg-[#0d0f12] border border-[#232936] rounded-xl px-4 py-3 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-orange-400 font-mono">
                <button type="button" onclick="searchDrama()" id="btnSearch" class="bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold px-6 py-3 rounded-xl text-xs transition-all shadow cursor-pointer">
                    🔍 Cari Drama
                </button>
                <button type="button" onclick="loadHomepage()" class="bg-[#1e2330] hover:bg-[#2b3344] text-orange-400 font-bold px-4 py-3 rounded-xl text-xs transition-all border border-[#2b3344] cursor-pointer">
                    🏠 Home / Trending
                </button>
            </div>
        </div>

        <!-- CONTAINER CONTENT (List Drama atau Player) -->
        <div id="mainContent" class="space-y-4">
            <!-- Default Home / Search Results akan dimuat di sini -->
            <div class="bg-[#151922] border border-[#232936] rounded-2xl p-8 text-center text-slate-500 text-xs">
                Silakan cari judul drama atau klik tombol <span class="text-orange-400">Home / Trending</span> untuk memuat daftar drama Viu.
            </div>
        </div>

        <!-- MODAL / DETAIL / PLAYER CONTAINER -->
        <div id="detailContainer" class="hidden bg-[#151922] border border-[#232936] rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-[#232936] pb-3">
                <div>
                    <h2 id="detailTitle" class="text-sm font-bold text-white">Judul Drama</h2>
                    <p class="text-[10px] text-slate-400">Pilih episode dan resolusi tontonan.</p>
                </div>
                <button type="button" onclick="closeDetail()" class="px-3 py-1 bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 rounded-lg text-xs font-bold cursor-pointer">✕ Tutup</button>
            </div>

            <!-- Video Player & Resolusi -->
            <div id="playerSection" class="hidden space-y-3 bg-[#0d0f12] p-4 rounded-xl border border-orange-500/30">
                <div class="flex items-center justify-between text-xs">
                    <span id="playingEpisodeTitle" class="text-orange-400 font-bold">Episode -</span>
                    <select id="qualitySelect" onchange="changeResolution()" class="bg-[#151922] border border-[#232936] text-slate-200 px-2 py-1 rounded-lg text-xs">
                        <option value="1080p">1080p (Full HD)</option>
                        <option value="720p">720p (HD)</option>
                        <option value="480p">480p (SD)</option>
                        <option value="240p">240p (Low)</option>
                    </select>
                </div>
                <div class="w-full aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center">
                    <video id="videoPlayer" controls class="w-full h-full object-contain"></video>
                </div>
                <div class="flex space-x-2">
                    <a id="downloadStreamBtn" href="#" target="_blank" class="flex-1 text-center bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold py-2 rounded-lg text-xs transition-all">
                        📥 Buka Link Stream / Download
                    </a>
                </div>
            </div>

            <!-- List Episodes -->
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">DAFTAR EPISODE</label>
                <div id="episodeListGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Episode items dimuat via JS -->
                </div>
            </div>
        </div>

        <div class="pt-2 text-center text-[11px] text-slate-400">
            <span>ReyCloudSHP Viu Streaming Center</span>
        </div>

    </div>

    <script>
        let currentSeriesId = null;
        let currentEpisodes = [];
        let activeEpisodeId = null;
        let activeEpisodeName = null;

        async function loadHomepage() {
            const container = document.getElementById('mainContent');
            container.innerHTML = `<div class="bg-[#151922] border border-[#232936] rounded-2xl p-8 text-center text-orange-400 animate-pulse text-xs">Memuat beranda Viu...</div>`;

            try {
                const res = await fetch('/api/viu/home');
                const json = await res.json();

                if (json.status && json.data?.items) {
                    container.innerHTML = '';
                    json.data.items.forEach(mod => {
                        const section = document.createElement('div');
                        section.className = "bg-[#151922] border border-[#232936] rounded-2xl p-4 space-y-3";
                        
                        let itemsHtml = '';
                        mod.items.forEach(item => {
                            const itemId = item.id || item.series_id;
                            const itemTitle = item.title || 'Tanpa Judul';
                            itemsHtml += `
                                <div onclick="loadDetail('${itemId}', '${encodeURIComponent(itemTitle)}')" class="bg-[#0d0f12] border border-[#232936] hover:border-orange-400/60 p-3 rounded-xl cursor-pointer transition-all space-y-1">
                                    <div class="font-bold text-white text-xs truncate">${itemTitle}</div>
                                    <div class="text-[10px] text-orange-400 font-mono">Klik untuk nonton ➔</div>
                                </div>
                            `;
                        });

                        section.innerHTML = `
                            <div class="font-bold text-xs text-orange-400 border-b border-[#232936] pb-2">${mod.module_name}</div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">${itemsHtml}</div>
                        `;
                        container.appendChild(section);
                    });
                } else {
                    container.innerHTML = `<div class="bg-[#151922] border border-[#232936] rounded-2xl p-8 text-center text-slate-400 text-xs">Tidak ada data beranda.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="bg-[#151922] border border-[#232936] rounded-2xl p-8 text-center text-rose-400 text-xs">Error: ${err.message}</div>`;
            }
        }

        async function searchDrama() {
            const query = document.getElementById('searchQuery').value.trim();
            if (!query) return alert('Masukkan kata kunci pencarian!');

            const container = document.getElementById('mainContent');
            container.innerHTML = `<div class="bg-[#151922] border border-[#232936] rounded-2xl p-8 text-center text-orange-400 animate-pulse text-xs">Mencari "${query}"...</div>`;

            try {
                const res = await fetch(`/api/viu/search?query=${encodeURIComponent(query)}`);
                const json = await res.json();

                if (json.status && json.data?.items) {
                    container.innerHTML = '';
                    const items = json.data.items;

                    if (items.length === 0) {
                        container.innerHTML = `<div class="bg-[#151922] border border-[#232936] rounded-2xl p-8 text-center text-slate-400 text-xs">Drama tidak ditemukan.</div>`;
                        return;
                    }

                    const grid = document.createElement('div');
                    grid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 bg-[#151922] border border-[#232936] rounded-2xl p-4";

                    items.forEach(item => {
                        const itemId = item.id || item.series_id;
                        const itemTitle = item.title || 'Tanpa Judul';
                        const card = document.createElement('div');
                        card.className = "bg-[#0d0f12] border border-[#232936] hover:border-orange-400/60 p-3 rounded-xl cursor-pointer transition-all space-y-1";
                        card.onclick = () => loadDetail(itemId, encodeURIComponent(itemTitle));
                        card.innerHTML = `
                            <div class="font-bold text-white text-xs truncate">${itemTitle}</div>
                            <div class="text-[10px] text-orange-400 font-mono">ID: ${itemId}</div>
                        `;
                        grid.appendChild(card);
                    });
                    container.appendChild(grid);
                } else {
                    container.innerHTML = `<div class="bg-[#151922] border border-[#232936] rounded-2xl p-8 text-center text-slate-400 text-xs">Drama tidak ditemukan.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="bg-[#151922] border border-[#232936] rounded-2xl p-8 text-center text-rose-400 text-xs">Error: ${err.message}</div>`;
            }
        }

        async function loadDetail(id, encodedTitle) {
            currentSeriesId = id;
            const title = decodeURIComponent(encodedTitle);
            
            document.getElementById('detailTitle').textContent = title;
            document.getElementById('detailContainer').classList.remove('hidden');
            document.getElementById('playerSection').classList.add('hidden');

            const grid = document.getElementById('episodeListGrid');
            grid.innerHTML = `<div class="col-span-full text-center py-4 text-orange-400 text-xs animate-pulse">Memuat episode...</div>`;

            try {
                const res = await fetch(`/api/viu/detail?id=${id}`);
                const json = await res.json();

                if (json.status && json.data?.info?.episode_list) {
                    currentEpisodes = json.data.info.episode_list;
                    grid.innerHTML = '';

                    currentEpisodes.forEach((ep, idx) => {
                        const btn = document.createElement('button');
                        btn.type = "button";
                        btn.className = "bg-[#0d0f12] border border-[#232936] hover:border-orange-400 hover:text-orange-400 p-2 rounded-xl text-left text-xs font-mono text-slate-300 truncate cursor-pointer transition-all";
                        btn.textContent = `Ep ${ep.index || idx + 1}`;
                        btn.onclick = () => playEpisode(ep.id, ep.name);
                        grid.appendChild(btn);
                    });
                } else {
                    grid.innerHTML = `<div class="col-span-full text-center py-4 text-slate-400 text-xs">Daftar episode tidak tersedia.</div>`;
                }
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-center py-4 text-rose-400 text-xs">Gagal memuat episode.</div>`;
            }
        }

        async function playEpisode(epsId, epName) {
            activeEpisodeId = epsId;
            activeEpisodeName = epName;
            
            const playerSec = document.getElementById('playerSection');
            const video = document.getElementById('videoPlayer');
            const streamBtn = document.getElementById('downloadStreamBtn');
            const q = document.getElementById('qualitySelect').value;

            playerSec.classList.remove('hidden');
            document.getElementById('playingEpisodeTitle').textContent = `Memutar: ${epName}`;
            video.src = '';

            try {
                const res = await fetch(`/api/viu/stream?id=${currentSeriesId}&epsid=${epsId}&quality=${q}`);
                const json = await res.json();

                if (json.status && json.result?.url) {
                    video.src = json.result.url;
                    streamBtn.href = json.result.url;
                    video.play();
                } else {
                    alert('Gagal mengambil link stream: ' + (json.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Error streaming: ' + err.message);
            }
        }

        async function changeResolution() {
            if (activeEpisodeId && activeEpisodeName) {
                playEpisode(activeEpisodeId, activeEpisodeName);
            }
        }

        function closeDetail() {
            document.getElementById('detailContainer').classList.add('hidden');
            document.getElementById('videoPlayer').pause();
        }
    </script>
</body>
</html>
