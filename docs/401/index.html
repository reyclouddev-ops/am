<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#080a0f;color:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;transition:.3s}.grid{position:fixed;inset:0;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:32px 32px}.glow{position:fixed;width:260px;height:260px;background:#3b82f622;filter:blur(90px);border-radius:50%}.card{position:relative;width:100%;max-width:460px;text-align:center;padding:32px 24px;border:1px solid #ffffff12;background:#10141ccc;backdrop-filter:blur(18px);border-radius:28px}.brand{font-size:12px;font-weight:900;letter-spacing:3px;margin-bottom:20px}.brand span{color:#60a5fa}.robot{width:130px;height:130px;animation:f 3s infinite ease-in-out}.head{fill:#e2e8f0;stroke:#60a5fa;stroke-width:3}.body{fill:#cbd5e1;stroke:#60a5fa;stroke-width:3}.eye{fill:#0f172a}.lock{fill:#60a5fa}@keyframes f{50%{transform:translateY(-7px)}}.status{display:inline-flex;gap:8px;padding:7px 12px;border-radius:99px;background:#3b82f612;border:1px solid #60a5fa44;color:#93c5fd;font:700 10px monospace}.dot{width:7px;height:7px;background:#60a5fa;border-radius:50%}.code{font-size:58px;font-weight:1000;color:#60a5fa}.title{font-size:21px;font-weight:900}.desc{font-size:12px;color:#94a3b8;line-height:1.7;margin:8px 0 24px}.actions{display:flex;gap:10px}.btn{flex:1;padding:12px;border-radius:13px;text-decoration:none;border:0;background:#3b82f6;color:#fff;font-size:11px;font-weight:900;cursor:pointer}.secondary{background:#ffffff08;border:1px solid #ffffff12;color:#cbd5e1}button.theme{position:fixed;right:18px;top:18px;width:38px;height:38px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff15;color:#fff}.light{background:#f1f5f9;color:#0f172a}.light .card{background:#fff;border-color:#cbd5e1}.light .desc{color:#64748b}.light .secondary{color:#334155}.light .head{fill:#1e293b}.light .body{fill:#334155}@media(max-width:420px){. <body><div class="grid"></div><div class="glow"></div><button class="theme" onclick="toggle()">☀️</button><main class="card"><div class="brand">REY<span>CLOUD</span></div><svg class="robot" viewBox="0 0 140 140"><rect class="body" x="42" y="78" width="56" height="38" rx="12"/><rect class="head" x="30" y="35" width="80" height="55" rx="17"/><circle class="eye" cx="57" cy="57" r="6"/><circle class="eye" cx="83" cy="57" r="6"/><rect class="lock" x="61" y="70" width="18" height="15" rx="3"/><path d="M65 70v-5a5 5 0 0110 0v5" fill="none" stroke="#60a5fa" stroke-width="3"/><path d="M70 35V23" stroke="#60a5fa" stroke-width="3"/><circle class="lock" cx="70" cy="18" r="6"/></svg><div class="status"><span class="dot"></span>GET → 401</div><div class="code">401</div><div class="title">Unauthorized</div><div class="desc">Kamu perlu melakukan autentikasi sebelum dapat mengakses resource ini.</div><div class="actions"><a class="btn" href="/dashboard">Dashboard</a><button class="btn secondary" onclick="history.back()">Kembali</button></div></main><script>let m=localStorage.getItem('rey_status_theme')||'dark';const b=document.body,x=document.querySelector('.theme');function a(){b.classList.toggle('light',m==='light');x.textContent=m==='light'?'🌙':'☀️'}function toggle(){m=m==='dark'?'light':'dark';localStorage.setItem('rey_status_theme',m);a()}a()</script></body></html>
