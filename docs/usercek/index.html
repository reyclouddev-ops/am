<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReyCloudSHP - Cek Masa Aktif API Key</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0d0f12; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 relative">

    <div class="w-full max-w-md space-y-4">
        
        <!-- Navbar -->
        <div class="flex items-center justify-between bg-[#151922] border border-[#232936] rounded-2xl p-4 shadow-lg">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 font-bold">
                    🔍
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <span class="font-extrabold text-sm tracking-wide text-white">CHECK<span class="text-cyan-400">KEY</span></span>
                    </div>
                    <span class="text-[10px] tracking-widest text-slate-400 font-semibold uppercase">USER PORTAL</span>
                </div>
            </div>
            
            <a href="/dashboard" class="px-3 py-1.5 rounded-xl bg-[#1e2330] border border-[#2b3344] text-[11px] text-slate-300 hover:text-white transition-all font-medium">
                Beranda Utama
            </a>
        </div>

        <!-- CARD CEK KEY -->
        <div class="bg-[#151922] border border-[#232936] rounded-2xl p-6 shadow-xl space-y-4">
            <div class="space-y-1">
                <h2 class="text-sm font-bold text-white tracking-tight">Cek Status & Sisa Hari Key</h2>
                <p class="text-[11px] text-slate-400 leading-relaxed">Masukkan API Key Bulk milikmu untuk melihat masa aktif dan status berlangganan.</p>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">API KEY ANDA</label>
                    <input type="text" id="checkKeyInput" placeholder="reycoder_XXXXXX" 
                        class="w-full bg-[#0d0f12] border border-[#232936] rounded-xl px-4 py-3 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-400 font-mono">
                </div>

                <button onclick="checkMyKey()" id="btnCheck"
                    class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl text-xs transition-all shadow cursor-pointer">
                    🔍 Cek Masa Aktif
                </button>
            </div>

            <!-- RESULT BOX -->
            <div id="checkResultBox" class="hidden space-y-2.5 bg-[#0d0f12] border border-cyan-500/30 rounded-xl p-4 text-xs font-mono">
                <div class="flex justify-between items-center border-b border-[#232936] pb-2 text-xs">
                    <span class="text-cyan-400 font-bold">Hasil Pengecekan</span>
                    <span id="checkStatusBadge" class="px-2 py-0.5 rounded text-[10px] font-bold"></span>
                </div>
                <div class="space-y-1.5 text-slate-300 pt-1">
                    <div><b>Owner:</b> <span id="checkOwner" class="text-white"></span></div>
                    <div><b>Paket:</b> <span id="checkPackage" class="text-purple-300"></span></div>
                    <div><b>Sisa Hari:</b> <span id="checkRemaining" class="text-amber-400 font-bold"></span></div>
                    <div><b>Kadaluarsa:</b> <span id="checkExpired" class="text-slate-400 text-[10px]"></span></div>
                </div>
            </div>
        </div>

        <div class="pt-2 text-center text-[11px] text-slate-400">
            <span>ReyCloudSHP Portal</span>
        </div>

    </div>

    <script>
        async function checkMyKey() {
            const apikey = document.getElementById('checkKeyInput').value.trim();
            const btnCheck = document.getElementById('btnCheck');
            const checkResultBox = document.getElementById('checkResultBox');

            if (!apikey) return alert('Masukkan API Key Anda terlebih dahulu!');

            btnCheck.disabled = true;
            btnCheck.textContent = 'Mengecek...';
            checkResultBox.classList.add('hidden');

            try {
                // Diarahkan ke endpoint murni /api/apikey/check sesuai engine.js backend
                const res = await fetch('/api/apikey/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apikey })
                });

                const data = await res.json();

                if (data.status && data.data) {
                    checkResultBox.classList.remove('hidden');
                    const d = data.data;

                    document.getElementById('checkOwner').textContent = d.owner;
                    document.getElementById('checkPackage').textContent = d.package;
                    document.getElementById('checkExpired').textContent = new Date(d.expired_at).toLocaleString();

                    const badge = document.getElementById('checkStatusBadge');
                    const remainingEl = document.getElementById('checkRemaining');

                    if (d.remaining_days === 'Unlimited') {
                        remainingEl.textContent = '♾️ Unlimited (Selamanya)';
                        badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-purple-500/10 text-purple-400';
                        badge.textContent = 'ACTIVE';
                    } else if (d.remaining_days === 'Expired') {
                        remainingEl.textContent = '❌ Telah Habis';
                        badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-rose-500/10 text-rose-400';
                        badge.textContent = 'EXPIRED';
                    } else {
                        remainingEl.textContent = `${d.remaining_days} Hari Lagi`;
                        badge.className = 'px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/10 text-emerald-400';
                        badge.textContent = 'ACTIVE';
                    }
                } else {
                    alert('Cek Key Gagal: ' + (data.error || 'API Key tidak ditemukan.'));
                }
            } catch (err) {
                alert('Kesalahan koneksi: ' + err.message);
            } finally {
                btnCheck.disabled = false;
                btnCheck.textContent = '🔍 Cek Masa Aktif';
            }
        }
    </script>
</body>
</html>
